name: Keep Render report awake
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.RENDER_REPORT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Streamlit health
        env:
          REPORT_URL: ${{ vars.RENDER_REPORT_URL }}
        run: |
          response=$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 45 "${REPORT_URL%/}/_stcore/health")
          test "$response" = "ok"
